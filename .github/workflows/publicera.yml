# Builds TSS-en and publishes it on GitHub Pages on every change in main.
# The build script is shared with the Swedish version and is fetched from tss-sv,
# so the two language versions are always built the same way.
# --sprak gives every page the link to the same page in Swedish, hreflang and the link to the language choice on www.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the shared build script from tss-sv
        uses: actions/checkout@v4
        with:
          repository: towardssustainablesociety/tss-sv
          path: tss-sv

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build the site
        env:
          TSS_FORRAD: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 tss-sv/bygg/bygg.py texter _site --lang en --sprak | tee buildlog.txt
          echo '### Build' >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' buildlog.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
